name: Daily Email Cron

on:
  schedule:
    # Runs at 09:00 UTC every day
    - cron: '0 9 * * 1'

jobs:
  cron-job:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Next.js API
        run: |
          curl -X GET ${{ secrets.NEXT_PUBLIC_APP_URL }}/api/cron/send-newsletter \
          -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}"